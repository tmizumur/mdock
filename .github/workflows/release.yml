# main にマージされるたびに Mac 版をビルドして GitHub Releases に公開する。
# アプリ内の「更新して再起動」ボタンは、ここで公開された latest.json を見て新しい版を探す。
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # バージョンを 0.1.<実行番号> に上げ、更新用ファイル（署名付き）を作る設定を有効にする
      - name: Set version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          jq --arg v "$VERSION" '.version = $v | .bundle.createUpdaterArtifacts = true' \
            src-tauri/tauri.conf.json > /tmp/conf.json && mv /tmp/conf.json src-tauri/tauri.conf.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # 前回のリリース以降に main へマージされた PR のタイトル一覧を作る。
      # リリースの本文と latest.json の notes になり、アプリの「更新」ボタンのポップオーバーに表示される。
      - name: Release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          PREV_TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || true)
          SEARCH=""
          if [ -n "$PREV_TAG" ]; then
            # 前回のリリースのコミット（= そのときのマージ）より後にマージされたもの
            SINCE=$(gh api "repos/$REPO/commits/$PREV_TAG" --jq .commit.committer.date)
            SEARCH="merged:>$SINCE"
          fi
          NOTES=$(gh pr list --repo "$REPO" --state merged --base main --limit 100 --search "$SEARCH" \
            --json number,title --jq 'sort_by(.number) | .[] | "- \(.title) (#\(.number))"' || true)
          # PR を通さずに push された場合などは、最後のコミットのメッセージを使う
          if [ -z "$NOTES" ]; then NOTES=$(git log -1 --format=%B); fi
          echo "$NOTES"
          {
            echo "body<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Mdock v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin --bundles app,dmg
